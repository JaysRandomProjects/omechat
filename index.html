<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmeChat</title>
  
  <!-- Custom OME CHAT SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000000'/><text x='50%' y='40%' text-anchor='middle' font-family='Arial Black, Impact, sans-serif' font-weight='900' font-size='32' fill='%23FFB6C1' stroke='%2300BFFF' stroke-width='4' paint-order='stroke fill'>OME</text><text x='50%' y='78%' text-anchor='middle' font-family='Arial Black, Impact, sans-serif' font-weight='900' font-size='28' fill='%2300BFFF' stroke='%23FFB6C1' stroke-width='3.5' paint-order='stroke fill'>CHAT</text></svg>">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler for JSX CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- PeerJS Client -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Fredoka+One&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .logo-font { font-family: 'Fredoka One', 'Arial Black', sans-serif; }
    
    .bubble-ome {
      color: #FFB6C1;
      -webkit-text-stroke: 2.5px #00BFFF;
      paint-order: stroke fill;
    }
    .bubble-chat {
      color: #00BFFF;
      -webkit-text-stroke: 2.5px #FFB6C1;
      paint-order: stroke fill;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #222222; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #333333; }
  </style>
</head>
<body class="bg-black text-gray-200 antialiased selection:bg-[#FFB6C1] selection:text-black min-h-screen flex flex-col">

  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SERVER_URL = "omechat-dshk.onrender.com";

    // WebRTC ICE Configuration with STUN and TURN Relays
    const ICE_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        {
          urls: "turn:openrelay.metered.ca:80",
          username: "openrelay",
          credential: "openrelay"
        },
        {
          urls: "turn:openrelay.metered.ca:443",
          username: "openrelay",
          credential: "openrelay"
        }
      ]
    };

    function App() {
      const [view, setView] = useState('landing'); // 'landing' | 'chat'
      const [chatMode, setChatMode] = useState('text'); // 'text' | 'video'
      const [status, setStatus] = useState('idle'); // 'idle' | 'searching' | 'connected' | 'disconnected'
      const [messages, setMessages] = useState([]);
      const [inputMsg, setInputMsg] = useState('');
      const [micActive, setMicActive] = useState(true);
      const [camActive, setCamActive] = useState(true);

      const peerRef = useRef(null);
      const peerConnRef = useRef(null);
      const callRef = useRef(null);
      const localStreamRef = useRef(null);
      
      const localVideoRef = useRef(null);
      const remoteVideoRef = useRef(null);
      const messagesEndRef = useRef(null);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      // Connect to global signaling server on Render
      useEffect(() => {
        const peer = new Peer(undefined, {
          host: SERVER_URL,
          port: 443,
          path: '/peerjs',
          secure: true,
          config: ICE_CONFIG
        });

        peerRef.current = peer;

        peer.on('connection', (conn) => {
          peerConnRef.current = conn;
          setupDataConnectionHandlers(conn);
        });

        peer.on('call', async (call) => {
          callRef.current = call;
          if (localStreamRef.current) {
            call.answer(localStreamRef.current);
          } else {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
              localStreamRef.current = stream;
              if (localVideoRef.current) localVideoRef.current.srcObject = stream;
              call.answer(stream);
            } catch (err) {
              console.error("Camera/Mic access error:", err);
            }
          }

          call.on('stream', (remoteStream) => {
            if (remoteVideoRef.current) remoteVideoRef.current.srcObject = remoteStream;
          });

          call.on('close', () => {
            handlePartnerDisconnected();
          });
        });

        return () => {
          cleanupConnections();
          if (peerRef.current) peerRef.current.destroy();
        };
      }, []);

      const setupDataConnectionHandlers = (conn) => {
        setStatus('connected');
        setMessages([]);

        conn.on('data', (data) => {
          if (data.type === 'message') {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            setMessages((prev) => [...prev, { sender: 'stranger', text: data.text, timestamp: time }]);
          } else if (data.type === 'disconnect') {
            handlePartnerDisconnected();
          }
        });

        conn.on('close', () => {
          handlePartnerDisconnected();
        });
      };

      const handlePartnerDisconnected = () => {
        setStatus('disconnected');
        if (remoteVideoRef.current) remoteVideoRef.current.srcObject = null;
      };

      const cleanupConnections = () => {
        if (peerConnRef.current) {
          try { peerConnRef.current.send({ type: 'disconnect' }); } catch(e){}
          peerConnRef.current.close();
          peerConnRef.current = null;
        }
        if (callRef.current) {
          callRef.current.close();
          callRef.current = null;
        }
        if (remoteVideoRef.current) remoteVideoRef.current.srcObject = null;
      };

      const stopMediaStream = () => {
        if (localStreamRef.current) {
          localStreamRef.current.getTracks().forEach(track => track.stop());
          localStreamRef.current = null;
        }
      };

      const startMatchmaking = async (mode) => {
        cleanupConnections();
        setStatus('searching');

        if (mode === 'video' && !localStreamRef.current) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localStreamRef.current = stream;
            if (localVideoRef.current) localVideoRef.current.srcObject = stream;
          } catch (e) {
            console.error("Media permission denied");
          }
        }

        if (peerRef.current && peerRef.current.id) {
          fetch(`https://${SERVER_URL}/match?id=${peerRef.current.id}&mode=${mode}`)
            .then(res => res.json())
            .then(data => {
              if (data.partnerId) {
                connectToPeer(data.partnerId, mode);
              }
            })
            .catch(err => console.error("Matchmaking error:", err));
        }
      };

      const connectToPeer = (partnerPeerId, mode) => {
        if (!peerRef.current) return;

        const conn = peerRef.current.connect(partnerPeerId);
        peerConnRef.current = conn;
        setupDataConnectionHandlers(conn);

        if (mode === 'video' && localStreamRef.current) {
          const call = peerRef.current.call(partnerPeerId, localStreamRef.current);
          callRef.current = call;
          call.on('stream', (remoteStream) => {
            if (remoteVideoRef.current) remoteVideoRef.current.srcObject = remoteStream;
          });
        }
      };

      const startChatting = (mode) => {
        setChatMode(mode);
        setView('chat');
        setMessages([]);
        startMatchmaking(mode);
      };

      const handleNext = () => {
        cleanupConnections();
        setMessages([]);
        startMatchmaking(chatMode);
      };

      const handleStop = () => {
        cleanupConnections();
        stopMediaStream();
        setStatus('idle');
        setView('landing');
      };

      const sendMessage = (e) => {
        e.preventDefault();
        if (!inputMsg.trim() || status !== 'connected' || !peerConnRef.current) return;

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const cleanText = inputMsg.trim();

        peerConnRef.current.send({ type: 'message', text: cleanText });
        setMessages((prev) => [...prev, { sender: 'you', text: cleanText, timestamp: time }]);
        setInputMsg('');
      };

      const toggleMic = () => {
        if (localStreamRef.current) {
          const audioTrack = localStreamRef.current.getAudioTracks()[0];
          if (audioTrack) {
            audioTrack.enabled = !audioTrack.enabled;
            setMicActive(audioTrack.enabled);
          }
        }
      };

      const toggleCam = () => {
        if (localStreamRef.current) {
          const videoTrack = localStreamRef.current.getVideoTracks()[0];
          if (videoTrack) {
            videoTrack.enabled = !videoTrack.enabled;
            setCamActive(videoTrack.enabled);
          }
        }
      };

      return (
        <div className="flex flex-col min-h-screen bg-black text-gray-200">
          {/* Top Bar */}
          <header className="border-b border-zinc-900 bg-black px-6 h-16 flex items-center justify-between sticky top-0 z-50">
            <div onClick={handleStop} className="flex items-center gap-2 cursor-pointer logo-font">
              <span className="bubble-ome text-xl tracking-wider">OME</span>
              <span className="bubble-chat text-xl tracking-wider">CHAT</span>
            </div>

            {view === 'chat' && (
              <button 
                onClick={handleStop}
                className="text-xs uppercase tracking-widest text-zinc-400 hover:text-[#FFB6C1] transition font-semibold"
              >
                Exit
              </button>
            )}
          </header>

          <main className="flex-1 flex flex-col">
            {/* Landing */}
            {view === 'landing' && (
              <div className="flex-1 flex flex-col justify-center items-center px-4 py-12 max-w-xl mx-auto text-center">
                
                <div className="mb-8 logo-font select-none">
                  <div className="bubble-ome text-7xl md:text-8xl tracking-wider leading-none">OME</div>
                  <div className="bubble-chat text-7xl md:text-8xl tracking-wider leading-none mt-1">CHAT</div>
                  <div className="text-zinc-600 text-xs tracking-widest mt-4 font-mono">
                    IMJSJAYFR
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-4 w-full">
                  <button 
                    onClick={() => startChatting('text')}
                    className="py-4 px-6 rounded-xl bg-zinc-950 border border-zinc-800 hover:border-[#FFB6C1] text-white font-bold text-sm tracking-wide transition flex flex-col items-center gap-2 group"
                  >
                    <span className="text-[#FFB6C1] group-hover:scale-110 transition-transform">Text</span>
                  </button>

                  <button 
                    onClick={() => startChatting('video')}
                    className="py-4 px-6 rounded-xl bg-[#FFB6C1] hover:bg-[#f4a7b3] text-black font-bold text-sm tracking-wide transition flex flex-col items-center gap-2"
                  >
                    <span>Video</span>
                  </button>
                </div>

              </div>
            )}

            {/* Chat View */}
            {view === 'chat' && (
              <div className="flex-1 flex flex-col md:flex-row max-w-6xl w-full mx-auto p-4 gap-4 overflow-hidden h-[calc(100vh-4rem)]">
                
                {chatMode === 'video' && (
                  <div className="flex-1 bg-zinc-950 border border-zinc-900 rounded-2xl relative overflow-hidden flex items-center justify-center min-h-[250px]">
                    <video 
                      ref={remoteVideoRef} 
                      autoPlay 
                      playsInline 
                      className="w-full h-full object-cover"
                    />
                    
                    {status !== 'connected' && (
                      <div className="absolute inset-0 bg-black/90 flex flex-col items-center justify-center p-6">
                        <p className="text-zinc-400 text-sm font-medium">
                          {status === 'searching' ? 'Looking for stranger...' : 'Disconnected'}
                        </p>
                      </div>
                    )}

                    <div className="absolute bottom-4 right-4 w-32 h-24 bg-black border border-zinc-800 rounded-lg overflow-hidden">
                      <video 
                        ref={localVideoRef} 
                        autoPlay 
                        muted 
                        playsInline 
                        className="w-full h-full object-cover transform -scale-x-100"
                      />
                    </div>

                    <div className="absolute bottom-4 left-4 flex gap-2">
                      <button 
                        onClick={toggleMic}
                        className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${micActive ? 'bg-zinc-900 text-zinc-300' : 'bg-red-950 text-red-400 border border-red-900'}`}
                      >
                        {micActive ? 'Mute' : 'Unmute'}
                      </button>
                      <button 
                        onClick={toggleCam}
                        className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${camActive ? 'bg-zinc-900 text-zinc-300' : 'bg-red-950 text-red-400 border border-red-900'}`}
                      >
                        {camActive ? 'Cam Off' : 'Cam On'}
                      </button>
                    </div>
                  </div>
                )}

                {/* Message Box */}
                <div className={`flex-1 flex flex-col bg-zinc-950 border border-zinc-900 rounded-2xl overflow-hidden ${chatMode === 'video' ? 'md:max-w-md' : 'w-full'}`}>
                  
                  <div className="p-3 border-b border-zinc-900 bg-black flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <div className={`w-2 h-2 rounded-full ${
                        status === 'connected' ? 'bg-[#FFB6C1]' :
                        status === 'searching' ? 'bg-amber-400 animate-pulse' : 'bg-red-500'
                      }`}></div>
                      <span className="text-xs font-medium text-zinc-400 uppercase tracking-wider">
                        {status === 'connected' ? 'Connected' : status === 'searching' ? 'Searching...' : 'Offline'}
                      </span>
                    </div>
                  </div>

                  <div className="flex-1 p-4 overflow-y-auto space-y-3">
                    {messages.map((msg, index) => (
                      <div 
                        key={index} 
                        className={`flex flex-col ${msg.sender === 'you' ? 'items-end' : 'items-start'}`}
                      >
                        <div className={`max-w-[80%] px-3.5 py-2 rounded-xl text-sm ${
                          msg.sender === 'you' 
                            ? 'bg-[#FFB6C1] text-black font-medium' 
                            : 'bg-zinc-900 text-zinc-200 border border-zinc-800'
                        }`}>
                          {msg.text}
                        </div>
                        <span className="text-[10px] text-zinc-600 mt-1">{msg.timestamp}</span>
                      </div>
                    ))}

                    {status === 'disconnected' && (
                      <div className="text-center my-4 text-xs text-zinc-500">
                        Stranger left the chat.
                      </div>
                    )}
                    <div ref={messagesEndRef} />
                  </div>

                  <div className="p-[#121318] border-t border-zinc-900 bg-black flex flex-col gap-2 p-3">
                    <form onSubmit={sendMessage} className="flex gap-2">
                      <input
                        type="text"
                        placeholder={status === 'connected' ? "Type a message..." : "Waiting..."}
                        value={inputMsg}
                        disabled={status !== 'connected'}
                        onChange={(e) => setInputMsg(e.target.value)}
                        className="flex-1 bg-zinc-900 border border-zinc-800 focus:border-[#FFB6C1] focus:outline-none rounded-xl px-4 py-2 text-sm text-zinc-100 disabled:opacity-40"
                      />
                      <button
                        type="submit"
                        disabled={status !== 'connected' || !inputMsg.trim()}
                        className="bg-[#FFB6C1] hover:bg-[#f4a7b3] disabled:opacity-30 text-black font-semibold text-sm px-4 py-2 rounded-xl transition"
                      >
                        Send
                      </button>
                    </form>

                    <div className="flex gap-2">
                      <button
                        onClick={handleStop}
                        className="flex-1 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-zinc-400 font-medium text-xs transition"
                      >
                        Stop
                      </button>
                      <button
                        onClick={handleNext}
                        className="flex-[2] py-2 rounded-xl bg-[#FFB6C1] hover:bg-[#f4a7b3] text-black font-bold text-xs transition"
                      >
                        Next Stranger
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
