<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmeChat - Random Chat</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler for JSX CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- PeerJS for WebRTC Video/Audio P2P Mesh -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- Socket.io for Real-time Text Matchmaking -->
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #121318; }
    ::-webkit-scrollbar-thumb { background: #2A2D3A; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3B3F51; }
  </style>
</head>
<body class="bg-[#0B0C10] text-gray-100 antialiased selection:bg-indigo-500 selection:text-white min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Public STUN servers for NAT traversal
    const ICE_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function App() {
      const [view, setView] = useState('landing'); // 'landing' | 'chat' | 'guidelines'
      const [chatMode, setChatMode] = useState('text'); // 'text' | 'video'
      const [status, setStatus] = useState('idle'); // 'idle' | 'searching' | 'connected' | 'disconnected'
      const [messages, setMessages] = useState([]);
      const [inputMsg, setInputMsg] = useState('');
      const [micActive, setMicActive] = useState(true);
      const [camActive, setCamActive] = useState(true);
      const [systemAlert, setSystemAlert] = useState('');

      const peerRef = useRef(null);
      const peerConnRef = useRef(null);
      const callRef = useRef(null);
      const localStreamRef = useRef(null);
      
      const localVideoRef = useRef(null);
      const remoteVideoRef = useRef(null);
      const messagesEndRef = useRef(null);

      // Auto-scroll messages
      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      // Initialize PeerJS on mount
      useEffect(() => {
        const peer = new Peer(undefined, { config: ICE_CONFIG });
        peerRef.current = peer;

        peer.on('open', (id) => {
          console.log('PeerJS initialized with ID:', id);
        });

        // Handle incoming data connection (Text Messaging)
        peer.on('connection', (conn) => {
          peerConnRef.current = conn;
          setupDataConnectionHandlers(conn);
        });

        // Handle incoming call (Video Streaming)
        peer.on('call', async (call) => {
          callRef.current = call;
          if (localStreamRef.current) {
            call.answer(localStreamRef.current);
          } else {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
              localStreamRef.current = stream;
              if (localVideoRef.current) localVideoRef.current.srcObject = stream;
              call.answer(stream);
            } catch (err) {
              setSystemAlert("Could not access camera/mic for incoming video call.");
            }
          }

          call.on('stream', (remoteStream) => {
            if (remoteVideoRef.current) remoteVideoRef.current.srcObject = remoteStream;
          });

          call.on('close', () => {
            handlePartnerDisconnected();
          });
        });

        return () => {
          cleanupConnections();
          if (peerRef.current) peerRef.current.destroy();
        };
      }, []);

      const setupDataConnectionHandlers = (conn) => {
        setStatus('connected');
        setMessages([]);
        setSystemAlert('');

        conn.on('data', (data) => {
          if (data.type === 'message') {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            setMessages((prev) => [...prev, { sender: 'stranger', text: data.text, timestamp: time }]);
          } else if (data.type === 'disconnect') {
            handlePartnerDisconnected();
          }
        });

        conn.on('close', () => {
          handlePartnerDisconnected();
        });
      };

      const handlePartnerDisconnected = () => {
        setStatus('disconnected');
        if (remoteVideoRef.current) remoteVideoRef.current.srcObject = null;
      };

      const cleanupConnections = () => {
        if (peerConnRef.current) {
          try { peerConnRef.current.send({ type: 'disconnect' }); } catch(e){}
          peerConnRef.current.close();
          peerConnRef.current = null;
        }
        if (callRef.current) {
          callRef.current.close();
          callRef.current = null;
        }
        if (remoteVideoRef.current) remoteVideoRef.current.srcObject = null;
      };

      const stopMediaStream = () => {
        if (localStreamRef.current) {
          localStreamRef.current.getTracks().forEach(track => track.stop());
          localStreamRef.current = null;
        }
      };

      // Matchmaking via global public broadcast channel or peer pairing
      const startMatchmaking = async (mode) => {
        cleanupConnections();
        setStatus('searching');

        // Check media permissions if video mode
        if (mode === 'video' && !localStreamRef.current) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localStreamRef.current = stream;
            if (localVideoRef.current) localVideoRef.current.srcObject = stream;
          } catch (e) {
            setSystemAlert("Camera/Mic access is required for video chat.");
          }
        }

        // Simulate peer discovery matchmaking via local BroadcastChannel across tabs/windows
        const channel = new BroadcastChannel('omechat_matchmaking');
        const myPeerId = peerRef.current?.id;

        channel.postMessage({ type: 'LOOKING_FOR_MATCH', mode, peerId: myPeerId });

        const handleMatchMessage = (event) => {
          const { type, mode: targetMode, peerId: partnerPeerId, targetPeerId } = event.data;

          if (type === 'LOOKING_FOR_MATCH' && targetMode === mode && partnerPeerId !== myPeerId) {
            // Initiate connection to discovered peer
            channel.postMessage({ type: 'ACCEPT_MATCH', targetPeerId: partnerPeerId, peerId: myPeerId, mode });
            connectToPeer(partnerPeerId, mode);
            channel.close();
          } else if (type === 'ACCEPT_MATCH' && targetPeerId === myPeerId) {
            connectToPeer(partnerPeerId, mode);
            channel.close();
          }
        };

        channel.onmessage = handleMatchMessage;
      };

      const connectToPeer = (partnerPeerId, mode) => {
        if (!peerRef.current) return;

        // Data Connection for messaging
        const conn = peerRef.current.connect(partnerPeerId);
        peerConnRef.current = conn;
        setupDataConnectionHandlers(conn);

        // Video Stream Connection if in video mode
        if (mode === 'video' && localStreamRef.current) {
          const call = peerRef.current.call(partnerPeerId, localStreamRef.current);
          callRef.current = call;
          call.on('stream', (remoteStream) => {
            if (remoteVideoRef.current) remoteVideoRef.current.srcObject = remoteStream;
          });
        }
      };

      const startChatting = (mode) => {
        setChatMode(mode);
        setView('chat');
        setMessages([]);
        startMatchmaking(mode);
      };

      const handleNext = () => {
        cleanupConnections();
        setMessages([]);
        startMatchmaking(chatMode);
      };

      const handleStop = () => {
        cleanupConnections();
        stopMediaStream();
        setStatus('idle');
        setView('landing');
      };

      const sendMessage = (e) => {
        e.preventDefault();
        if (!inputMsg.trim() || status !== 'connected' || !peerConnRef.current) return;

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const cleanText = inputMsg.trim();

        // Send via WebRTC Data Channel
        peerConnRef.current.send({ type: 'message', text: cleanText });
        setMessages((prev) => [...prev, { sender: 'you', text: cleanText, timestamp: time }]);
        setInputMsg('');
      };

      const toggleMic = () => {
        if (localStreamRef.current) {
          const audioTrack = localStreamRef.current.getAudioTracks()[0];
          if (audioTrack) {
            audioTrack.enabled = !audioTrack.enabled;
            setMicActive(audioTrack.enabled);
          }
        }
      };

      const toggleCam = () => {
        if (localStreamRef.current) {
          const videoTrack = localStreamRef.current.getVideoTracks()[0];
          if (videoTrack) {
            videoTrack.enabled = !videoTrack.enabled;
            setCamActive(videoTrack.enabled);
          }
        }
      };

      const reportPartner = () => {
        if (confirm("Report stranger for inappropriate content?")) {
          setSystemAlert('Partner has been reported.');
          handleNext();
        }
      };

      return (
        <div className="flex flex-col min-h-screen bg-[#0B0C10] text-gray-100">
          {/* Header */}
          <header className="border-b border-gray-800/80 bg-[#121318]/90 backdrop-blur sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div onClick={handleStop} className="flex items-center gap-3 cursor-pointer group">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 p-[2px] shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition-transform flex items-center justify-center">
                  <div className="w-full h-full bg-[#0B0C10] rounded-[10px] flex items-center justify-center p-2">
                    <svg className="w-full h-full text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                  </div>
                </div>
                <div>
                  <span className="text-xl font-bold bg-gradient-to-r from-white via-gray-200 to-indigo-400 bg-clip-text text-transparent">OmeChat</span>
                  <span className="hidden sm:inline-block ml-2 text-xs font-semibold px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">LIVE</span>
                </div>
              </div>

              <nav className="flex items-center gap-4 text-sm font-medium">
                <button 
                  onClick={() => { handleStop(); setView('landing'); }}
                  className={`hover:text-indigo-400 transition ${view === 'landing' ? 'text-indigo-400' : 'text-gray-400'}`}
                >
                  Home
                </button>
                <button 
                  onClick={() => setView('guidelines')}
                  className={`hover:text-indigo-400 transition ${view === 'guidelines' ? 'text-indigo-400' : 'text-gray-400'}`}
                >
                  Safety Guidelines
                </button>
              </nav>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 flex flex-col">
            {systemAlert && (
              <div className="bg-amber-500/10 border-b border-amber-500/20 text-amber-300 px-4 py-2 text-xs text-center font-medium animate-pulse flex items-center justify-center gap-2">
                <svg className="w-4 h-4 text-amber-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <span>{systemAlert}</span>
              </div>
            )}

            {/* View 1: Landing Page */}
            {view === 'landing' && (
              <div className="flex-1 flex flex-col justify-center items-center px-4 py-12 max-w-4xl mx-auto text-center">
                <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-semibold mb-6">
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                  </svg>
                  <span>Instant, Encrypted &amp; P2P WebRTC Matching</span>
                </div>
                
                <h1 className="text-4xl md:text-6xl font-extrabold tracking-tight text-white mb-4 leading-tight">
                  Talk to someone new.<br />
                  <span className="bg-gradient-to-r from-indigo-400 via-cyan-400 to-teal-300 bg-clip-text text-transparent">
                    Instantly &amp; Anonymously.
                  </span>
                </h1>

                <p className="text-gray-400 text-base md:text-lg max-w-2xl mb-10 leading-relaxed">
                  Meet random people across the globe over real-time text or peer-to-peer video streams. No registration required.
                </p>

                {/* Mode Selector Cards */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-xl mb-12">
                  <div 
                    onClick={() => startChatting('text')}
                    className="group relative bg-[#121318] border border-gray-800 hover:border-indigo-500/50 p-6 rounded-2xl cursor-pointer text-left transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-indigo-500/10 flex flex-col justify-between"
                  >
                    <div>
                      <div className="w-12 h-12 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 mb-4 group-hover:scale-110 transition-transform">
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                      </div>
                      <h3 className="text-xl font-bold text-white mb-2">Text Chat</h3>
                      <p className="text-sm text-gray-400">Pure text-based anonymous conversations. Fast and lightweight.</p>
                    </div>
                    <button className="mt-6 w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm transition">
                      Start Texting
                    </button>
                  </div>

                  <div 
                    onClick={() => startChatting('video')}
                    className="group relative bg-[#121318] border border-gray-800 hover:border-cyan-500/50 p-6 rounded-2xl cursor-pointer text-left transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-cyan-500/10 flex flex-col justify-between"
                  >
                    <div>
                      <div className="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 mb-4 group-hover:scale-110 transition-transform">
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                      </div>
                      <h3 className="text-xl font-bold text-white mb-2">Video Chat</h3>
                      <p className="text-sm text-gray-400">High-definition WebRTC video &amp; audio chat with peer-to-peer connection.</p>
                    </div>
                    <button className="mt-6 w-full py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-semibold text-sm transition">
                      Start Video
                    </button>
                  </div>
                </div>

                {/* Explanation */}
                <div className="border-t border-gray-800 pt-10 w-full max-w-3xl">
                  <h2 className="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-6">How Random Matching Works</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-left">
                    <div className="bg-[#121318]/50 p-4 rounded-xl border border-gray-800/50">
                      <div className="text-indigo-400 font-bold mb-1">1. Pick Mode</div>
                      <div className="text-xs text-gray-400">Choose between real-time video streaming or fast text messaging.</div>
                    </div>
                    <div className="bg-[#121318]/50 p-4 rounded-xl border border-gray-800/50">
                      <div className="text-indigo-400 font-bold mb-1">2. Match</div>
                      <div className="text-xs text-gray-400">Our P2P network matches you with an available online stranger in seconds.</div>
                    </div>
                    <div className="bg-[#121318]/50 p-4 rounded-xl border border-gray-800/50">
                      <div className="text-indigo-400 font-bold mb-1">3. Next or Stop</div>
                      <div className="text-xs text-gray-400">Instantly hit &quot;Next&quot; anytime to leave and switch to a new partner.</div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* View 2: Chat Interface */}
            {view === 'chat' && (
              <div className="flex-1 flex flex-col md:flex-row max-w-7xl w-full mx-auto p-4 gap-4 overflow-hidden h-[calc(100vh-4rem)]">
                
                {/* Video Container (Video mode) */}
                {chatMode === 'video' && (
                  <div className="flex-1 bg-[#121318] border border-gray-800 rounded-2xl relative overflow-hidden flex flex-col justify-center items-center min-h-[250px] md:min-h-0">
                    <video 
                      ref={remoteVideoRef} 
                      autoPlay 
                      playsInline 
                      className="w-full h-full object-cover"
                    />
                    
                    {status !== 'connected' && (
                      <div className="absolute inset-0 bg-[#121318]/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center">
                        <div className="w-12 h-12 rounded-full border-2 border-indigo-500 border-t-transparent animate-spin mb-4"></div>
                        <p className="text-gray-300 font-medium">
                          {status === 'searching' ? 'Searching for an available stranger...' : 'Stranger Disconnected.'}
                        </p>
                      </div>
                    )}

                    {/* Local Camera Picture-in-Picture */}
                    <div className="absolute bottom-4 right-4 w-32 h-24 md:w-48 md:h-36 bg-gray-900 border border-gray-700 rounded-xl overflow-hidden shadow-2xl">
                      <video 
                        ref={localVideoRef} 
                        autoPlay 
                        muted 
                        playsInline 
                        className="w-full h-full object-cover transform -scale-x-100"
                      />
                      <div className="absolute bottom-1 left-2 text-[10px] font-medium bg-black/60 px-1.5 py-0.5 rounded text-gray-300">You</div>
                    </div>

                    {/* Controls */}
                    <div className="absolute bottom-4 left-4 flex gap-2 bg-[#0B0C10]/80 backdrop-blur p-2 rounded-xl border border-gray-800">
                      <button 
                        onClick={toggleMic}
                        className={`p-2.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${micActive ? 'bg-gray-800 text-gray-200' : 'bg-red-500/20 text-red-400 border border-red-500/30'}`}
                      >
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                          {micActive ? (
                            <path strokeLinecap="round" strokeLinejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                          ) : (
                            <path strokeLinecap="round" strokeLinejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                          )}
                        </svg>
                        <span>{micActive ? 'Mic On' : 'Mic Off'}</span>
                      </button>
                      <button 
                        onClick={toggleCam}
                        className={`p-2.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${camActive ? 'bg-gray-800 text-gray-200' : 'bg-red-500/20 text-red-400 border border-red-500/30'}`}
                      >
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        <span>{camActive ? 'Cam On' : 'Cam Off'}</span>
                      </button>
                    </div>
                  </div>
                )}

                {/* Messaging Box */}
                <div className={`flex-1 flex flex-col bg-[#121318] border border-gray-800 rounded-2xl overflow-hidden ${chatMode === 'video' ? 'md:max-w-md' : 'w-full'}`}>
                  
                  {/* Status Bar */}
                  <div className="p-3 border-b border-gray-800/80 bg-[#161820] flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <div className={`w-2.5 h-2.5 rounded-full ${
                        status === 'connected' ? 'bg-emerald-500 animate-pulse' :
                        status === 'searching' ? 'bg-amber-500 animate-ping' : 'bg-red-500'
                      }`}></div>
                      <span className="text-xs font-semibold text-gray-300">
                        {status === 'connected' ? 'Connected to Stranger' : status === 'searching' ? 'Finding someone...' : 'Disconnected'}
                      </span>
                    </div>

                    {status === 'connected' && (
                      <button 
                        onClick={reportPartner}
                        className="text-xs px-2.5 py-1 rounded-lg bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 transition flex items-center gap-1"
                      >
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9" />
                        </svg>
                        <span>Report</span>
                      </button>
                    )}
                  </div>

                  {/* Messages Feed */}
                  <div className="flex-1 p-4 overflow-y-auto space-y-3">
                    <div className="text-center text-xs text-gray-500 my-2 flex items-center justify-center gap-1">
                      <svg className="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                      </svg>
                      <span>Direct Peer-to-Peer messaging. Do not share sensitive personal information.</span>
                    </div>

                    {messages.map((msg, index) => (
                      <div 
                        key={index} 
                        className={`flex flex-col ${msg.sender === 'you' ? 'items-end' : 'items-start'}`}
                      >
                        <div className={`max-w-[80%] px-4 py-2.5 rounded-2xl text-sm leading-relaxed ${
                          msg.sender === 'you' 
                            ? 'bg-indigo-600 text-white rounded-br-none' 
                            : 'bg-[#1E202B] text-gray-200 border border-gray-800 rounded-bl-none'
                        }`}>
                          {msg.text}
                        </div>
                        <span className="text-[10px] text-gray-500 mt-1 px-1">{msg.timestamp}</span>
                      </div>
                    ))}

                    {status === 'disconnected' && (
                      <div className="text-center my-4 p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-xs text-red-400">
                        Stranger has disconnected. Click &quot;Next Stranger&quot; to match with a new user.
                      </div>
                    )}
                    <div ref={messagesEndRef} />
                  </div>

                  {/* Controls */}
                  <div className="p-3 border-t border-gray-800 bg-[#161820] flex flex-col gap-2">
                    <form onSubmit={sendMessage} className="flex gap-2">
                      <input
                        type="text"
                        placeholder={status === 'connected' ? "Type a message..." : "Waiting for partner..."}
                        value={inputMsg}
                        disabled={status !== 'connected'}
                        onChange={(e) => setInputMsg(e.target.value)}
                        className="flex-1 bg-[#0B0C10] border border-gray-800 focus:border-indigo-500 focus:outline-none rounded-xl px-4 py-2 text-sm text-gray-200 disabled:opacity-50"
                      />
                      <button
                        type="submit"
                        disabled={status !== 'connected' || !inputMsg.trim()}
                        className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white font-medium text-sm px-4 py-2 rounded-xl transition"
                      >
                        Send
                      </button>
                    </form>

                    <div className="flex gap-2 pt-1">
                      <button
                        onClick={handleStop}
                        className="flex-1 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold text-xs transition"
                      >
                        Stop
                      </button>
                      <button
                        onClick={handleNext}
                        className="flex-[2] py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-semibold text-xs transition shadow-lg shadow-indigo-500/10 flex items-center justify-center gap-1"
                      >
                        <span>Next Stranger</span>
                        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            )}

            {/* View 3: Safety Page */}
            {view === 'guidelines' && (
              <div className="flex-1 max-w-3xl mx-auto px-4 py-10">
                <h1 className="text-3xl font-bold text-white mb-6">Community &amp; Safety Guidelines</h1>
                <div className="space-y-6 text-gray-300 text-sm leading-relaxed">
                  <section className="bg-[#121318] p-6 rounded-2xl border border-gray-800">
                    <h2 className="text-lg font-semibold text-indigo-400 mb-2">1. Age Requirement</h2>
                    <p>You must be at least 18 years old to use OmeChat. Minors are strictly prohibited from using the platform.</p>
                  </section>

                  <section className="bg-[#121318] p-6 rounded-2xl border border-gray-800">
                    <h2 className="text-lg font-semibold text-indigo-400 mb-2">2. Respectful Conduct</h2>
                    <p>Harassment, abusive language, explicit material, and illegal activity are forbidden. Always report users who violate guidelines.</p>
                  </section>

                  <section className="bg-[#121318] p-6 rounded-2xl border border-gray-800">
                    <h2 className="text-lg font-semibold text-indigo-400 mb-2">3. Protect Your Identity</h2>
                    <p>Do not share personal details, phone numbers, addresses, social media profiles, or financial credentials with strangers.</p>
                  </section>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-gray-800/60 py-4 text-center text-xs text-gray-500">
            &copy; OmeChat. Modern WebRTC Anonymous Random Chat.
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
